:root{

}

:root[data-theme="light"]{--bg:#00152C;--panel:rgba(3,38,78,.74);--ink:#F2F6FB;--ink-2:#8FAACB}
*,*::before,*::after{box-sizing:inherit}
html{min-height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100%;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 600px at 28% 18%,rgba(3,74,146,.55),transparent 70%),radial-gradient(700px 500px at 95% 100%,rgba(246,202,19,.07),transparent 70%),var(--bg);overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}

.floor{position:fixed;left:-20%;right:-20%;bottom:-6vh;height:48vh;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(95,143,198,.28) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(95,143,198,.28) 1.5px,transparent 1.5px);
  background-size:64px 64px;transform:perspective(420px) rotateX(62deg);transform-origin:bottom;
  -webkit-mask-image:linear-gradient(to top,#000 10%,transparent 85%);mask-image:linear-gradient(to top,#000 10%,transparent 85%);
  animation:floor 6s linear infinite}
@keyframes floor{to{background-position:0 64px,0 0}}

.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:22px 20px 60px}

.cham{clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.panel{position:relative;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:18px 20px}
.panel::after{content:"";position:absolute;top:0;right:22px;width:34px;height:3px;background:var(--yellow)}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
h2{margin:0;font-family:var(--display);font-weight:800;font-style:italic;font-size:24px;letter-spacing:.04em;text-transform:uppercase}
.ph span{font-size:13px;font-weight:600;color:var(--ink-2)}

.topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:14px}
.logo img{width:50px;height:50px;flex:none;filter:drop-shadow(0 0 12px rgba(246,202,19,.35))}
.logo b{display:block;font-family:var(--display);font-weight:900;font-style:italic;font-size:34px;line-height:.9;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.logo b em{font-style:inherit;color:var(--yellow);margin-right:.18em}
.logo span{font-size:12px;font-weight:700;color:var(--ink-2)}
.timer{justify-self:center;display:flex;align-items:center;gap:12px;padding:10px 20px;--cut:10px}
.timer span{font-size:12px;font-weight:700;color:var(--ink-2)}
.timer b{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.04em;font-variant-numeric:tabular-nums;color:var(--yellow)}
.timer .dot{width:8px;height:8px;border-radius:50%;background:#FF5A5A;box-shadow:0 0 10px #FF5A5A;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.chips{display:flex;gap:8px}
.chip{display:flex;flex-direction:column;justify-content:center;padding:8px 16px;--cut:10px;min-width:96px}
.chip b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.chip span{font-size:11px;font-weight:700;color:var(--ink-2);margin-top:3px}
.chip.gold{background:linear-gradient(135deg,#F6CA13,#D9A900);color:#00234A;box-shadow:0 0 24px rgba(246,202,19,.35)}
.chip.gold span{color:#00234A;opacity:.75}
.chip.gold::after{display:none}

.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.hero{grid-column:1;grid-row:1}
.side{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;gap:16px}
.trackp{grid-column:1;grid-row:2}
.vault{grid-column:1 / span 2;grid-row:3}

.card{position:relative;min-height:100%;padding:26px 28px 24px;--cut:22px;
  background:linear-gradient(160deg,rgba(3,74,146,.85),rgba(0,38,80,.92) 55%,rgba(0,26,56,.95));
  box-shadow:inset 0 0 0 1px rgba(246,202,19,.35);
  transform:perspective(1200px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out;will-change:transform}
.card::after{content:"";position:absolute;top:0;right:28px;width:64px;height:4px;background:var(--yellow)}
.glare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,70%) var(--gy,0%),rgba(255,255,255,.13),transparent 45%)}
.card canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ctop{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.ctop .rk{color:var(--yellow)}
.cmain{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;margin-top:14px}
.emb{position:relative;width:176px;height:176px;display:grid;place-items:center}
.emb svg{position:relative;width:150px;height:150px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.45))}
.emb .halo{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(246,202,19,.55),transparent 35%,transparent 50%,rgba(246,202,19,.35),transparent 85%);-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%,#000 70%,transparent 72%);mask:radial-gradient(circle,transparent 58%,#000 60%,#000 70%,transparent 72%);animation:spin 5s linear infinite}
.emb.steel .halo{background:conic-gradient(from 0deg,transparent,rgba(143,183,232,.45),transparent 40%)}
@keyframes spin{to{transform:rotate(360deg)}}
.acct{font-size:14px;font-weight:700;color:var(--ink-2)}
.pname{margin:2px 0 0;font-family:var(--display);font-weight:900;font-style:italic;font-size:clamp(52px,7.4vw,98px);line-height:.86;letter-spacing:-.005em;text-transform:uppercase;text-shadow:0 4px 0 rgba(0,20,45,.6)}
.xp{margin-top:16px}
.xpl{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.xpl b{font-family:var(--display);font-size:20px;font-weight:800;color:var(--ink);letter-spacing:.03em}
.xpbar{position:relative;height:14px;background:rgba(0,20,45,.7);box-shadow:inset 0 0 0 1px var(--line);transform:skewX(-18deg)}
.xpbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#8DB7E8,#F6CA13);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.xpbar .ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(20% - 2px),rgba(0,21,44,.9) calc(20% - 2px) 20%)}
.xpbar.over i{background:linear-gradient(90deg,#F6CA13,#FFE88A,#F6CA13);background-size:200% 100%;box-shadow:0 0 18px var(--glow);animation:shim 1.6s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.overtag{display:inline-block;margin-left:8px;padding:1px 8px;background:var(--yellow);color:#00234A;font-family:var(--display);font-weight:800;font-size:15px;transform:skewX(-12deg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px}
.stat{padding:12px 14px;background:rgba(0,21,44,.55);box-shadow:inset 0 0 0 1px var(--line);--cut:10px}
.stat span{display:block;font-size:12px;font-weight:700;color:var(--ink-2)}
.stat b{display:block;margin-top:2px;font-family:var(--display);font-weight:800;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.stat b small{font-size:20px;color:var(--ink-2);font-weight:700}
.stat.money b{color:var(--yellow);text-shadow:0 0 18px rgba(246,202,19,.35)}
.brk{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.brk b{color:var(--ink);font-weight:800}
.next{margin:14px 0 0;font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:10px}
.next::before{content:"";width:10px;height:10px;background:var(--yellow);transform:rotate(45deg);flex:none}
.enter .in{animation:in .45s cubic-bezier(.2,.8,.2,1) both}
.enter .in:nth-child(2){animation-delay:.05s}
.enter .in:nth-child(3){animation-delay:.1s}
.enter .in:nth-child(4){animation-delay:.15s}
.enter .in:nth-child(5){animation-delay:.2s}
@keyframes in{from{opacity:0;transform:translateX(-18px)}}

.row{position:relative;display:grid;grid-template-columns:30px 46px 1fr auto;align-items:center;gap:12px;width:100%;padding:10px 12px;margin-top:6px;background:rgba(0,21,44,.45);box-shadow:inset 0 0 0 1px var(--line);--cut:10px;transition:background .15s}
.row:hover{background:rgba(3,74,146,.5)}
.row.sel{background:linear-gradient(90deg,rgba(246,202,19,.2),rgba(3,74,146,.35));box-shadow:inset 3px 0 0 var(--yellow),inset 0 0 0 1px rgba(246,202,19,.4)}
.rpos{font-family:var(--display);font-weight:900;font-style:italic;font-size:28px;color:var(--ink-2)}
.row.first .rpos{color:var(--yellow)}
.row svg{width:44px;height:44px;display:block}
.rwho b{display:block;font-family:var(--display);font-weight:800;font-size:22px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.rwho span{font-size:12px;font-weight:600;color:var(--ink-2)}
.rbar{display:block;height:5px;margin-top:6px;background:rgba(0,21,44,.8);position:relative;transform:skewX(-18deg)}
.rbar i{position:absolute;inset:0 auto 0 0;background:var(--yellow)}
.ramt{font-family:var(--display);font-weight:800;font-size:26px;color:var(--yellow);font-variant-numeric:tabular-nums}

.locked{display:block;width:100%;padding:4px 0 0}
.hexes{display:grid;grid-template-columns:repeat(auto-fill,minmax(22px,1fr));gap:5px}
.hx{aspect-ratio:1/1.1;background:rgba(95,143,198,.22);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);transition:background .2s}
.locked:hover .hx,.locked.sel .hx{background:rgba(95,143,198,.42)}
.locked.sel .hx:nth-child(3n){background:rgba(246,202,19,.35)}
.hint{margin:12px 0 0;font-size:13px;font-weight:600;color:var(--ink-2);line-height:1.5}

.track{position:relative;height:150px;margin:6px 26px 0}
.tline{position:absolute;left:0;right:0;top:92px;height:6px;background:rgba(0,21,44,.8);box-shadow:inset 0 0 0 1px var(--line)}
.tline i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#8DB7E8,#F6CA13);box-shadow:0 0 14px var(--glow);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.node{position:absolute;top:95px;transform:translate(-50%,-50%);display:grid;place-items:center;width:30px;height:34px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#1B4677;font-family:var(--display);font-weight:800;font-size:16px;color:var(--ink-2)}
.node.hit{background:#8DB7E8;color:#00234A}
.node.summit{width:44px;height:50px;font-size:13px;background:#2A5A8E;color:var(--ink)}
.node.summit.hit{background:var(--yellow);color:#00234A;box-shadow:0 0 20px var(--glow)}
.node.od{background:#3A3310;color:#C9A83A}
.node.od.hit{background:var(--yellow);color:#00234A}
.nlab{position:absolute;top:128px;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.nlab.gold{color:var(--yellow)}
.mk{position:absolute;top:8px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:left 1s cubic-bezier(.2,.8,.2,1);opacity:.55}
.mk.sel{opacity:1;z-index:2}
.mk .tagx{padding:4px 9px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.04em;--cut:6px}
.mk.sel .tagx{background:var(--yellow);color:#00234A;box-shadow:0 0 16px var(--glow)}
.mk::after{content:"";width:2px;height:40px;background:linear-gradient(var(--ink-2),transparent)}
.mk.sel::after{background:linear-gradient(var(--yellow),transparent)}

.vgrid{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.vbig{font-family:var(--display);font-weight:900;font-style:italic;font-size:72px;line-height:.85;color:var(--yellow);text-shadow:0 0 26px rgba(246,202,19,.35);font-variant-numeric:tabular-nums}
.vbig small{display:block;margin-top:8px;font-family:var(--body);font-style:normal;font-size:13px;font-weight:700;color:var(--ink-2);text-shadow:none}
.cells{display:grid;grid-template-columns:repeat(20,1fr);gap:5px}
.cell{height:34px;transform:skewX(-18deg);background:repeating-linear-gradient(-45deg,rgba(95,143,198,.18) 0 4px,rgba(95,143,198,.07) 4px 8px);box-shadow:inset 0 0 0 1px var(--line)}
.cell.lit{background:linear-gradient(180deg,#FFE27A,#F6CA13);box-shadow:0 0 14px var(--glow);animation:pop .35s cubic-bezier(.2,.8,.2,1.4) both}
@keyframes pop{from{transform:skewX(-18deg) scaleX(.1);transform-origin:left;opacity:0}}
.split{display:flex;gap:6px;height:40px}
.seg{min-width:44px;display:flex;align-items:center;padding-left:12px;transform:skewX(-18deg);background:linear-gradient(180deg,#A9CBF0,#5F8FC6);animation:pop .4s cubic-bezier(.2,.8,.2,1.4) both}
.seg.top{background:linear-gradient(180deg,#FFE27A,#F6CA13);box-shadow:0 0 16px var(--glow)}
.seg em{transform:skewX(18deg);font-style:normal;font-family:var(--display);font-weight:800;font-size:18px;color:#00234A}
.vleg{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 20px;margin-top:12px;font-size:13px;font-weight:700;color:var(--ink-2)}
.vleg b{color:var(--ink)}
.vleg .y b{color:var(--yellow)}

@media (max-width:980px){
  .topbar{grid-template-columns:1fr auto}
  .timer{grid-column:1 / -1;grid-row:2;justify-self:stretch;justify-content:center}
  .grid{grid-template-columns:1fr}
  .hero,.side,.trackp,.vault{grid-column:1;grid-row:auto}
}
@media (max-width:640px){
  .topbar{grid-template-columns:1fr}
  .logo img{width:44px;height:44px}
  .logo b{font-size:30px}
  .chips{width:100%}
  .chip{flex:1;min-width:0;padding:8px 10px}
  .chip b{font-size:22px}
  .card{padding:22px 18px}
  .cmain>div:last-child{width:100%}
  .timer{flex-wrap:wrap;gap:6px 10px}
  .timer b{font-size:22px;white-space:nowrap}
  .cmain{grid-template-columns:1fr;justify-items:start;gap:10px}
  .emb{width:120px;height:120px}
  .emb svg{width:100px;height:100px}
  .stats{gap:6px}
  .stat{padding:10px}
  .stat b{font-size:30px}
  .track{margin:6px 14px 0}
  .mk .tagx{font-size:14px;padding:3px 6px}
  .nlab{font-size:10px}
  .vgrid{grid-template-columns:1fr;gap:14px}
  .split{height:34px}
}
@media (prefers-reduced-motion:reduce){
  .floor,.emb .halo,.timer .dot,.xpbar.over i{animation:none}
  .enter .in,.seg{animation:none}
  .xpbar i,.tline i,.mk,.card{transition:none}
}
</style>
</head>

    <section class="panel cham trackp">
      <div class="ph"><h2>Season track</h2><span id="trackHint"></span></div>
      <div class="track" id="track"><div class="tline"><i id="tfill"></i></div></div>
    </section>

    <section class="panel cham vault">
      <div class="ph"><h2>Prize vault</h2><span>Paid out so far</span></div>
      <div class="vgrid">
        <div class="vbig" id="vNow">$0<small>unlocked</small></div>
        <div>
          <div class="split" id="split" role="img"></div>
          <div class="vleg" id="vleg"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
const DATA = {
  seasonLabel: "September 2026",
  seasonEnd: "2026-10-01T00:00:00",
  totalPlayersLogged: 43,
  sdrs: [
    { id: "josh", name: "Josh G.", account: "Flowx.ai", meetings: 6, kpi: 5, bonus: 440, breakdown: [["Base bonus", 190], ["Above KPI", 250]] },
    { id: "altin", name: "Altin Krasniqi", account: "Shark Tank winner", meetings: 0, kpi: 5, bonus: 300, breakdown: [["Shark Tank win", 300]] },
    { id: "gentian", name: "Gentian Elezi", account: "Swimm", meetings: 1, kpi: 5, bonus: 70, breakdown: [] }
  
  ]
};

const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);
const money = n => "$" + Math.round(n).toLocaleString("en-US");
const initials = n => n.replace(/\./g, "").split(/\s+/).map(p => p[0]).join("").slice(0, 2).toUpperCase();

const sdrs = [...DATA.sdrs].sort((a, b) => b.bonus - a.bonus || b.meetings - a.meetings);
const totalBonus = sdrs.reduce((s, x) => s + x.bonus, 0);
const totalMeet = sdrs.reduce((s, x) => s + x.meetings, 0);
const lockedN = Math.max(0, DATA.totalPlayersLogged - sdrs.length);
const KPI = Math.max(...sdrs.map(s => s.kpi));
const TRACK_MAX = KPI + 3;

const TIERS = [
  { name: "Recruit", chev: 0 },
  { name: "Climber", chev: 1 },
  { name: "Ridge runner", chev: 2 },
  { name: "Summit", chev: 3 },
  { name: "Legend", chev: 3, star: true }
];
function tierOf(s){
  if (s.meetings > s.kpi) return 4;
  if (s.meetings === s.kpi) return 3;
  if (s.meetings / s.kpi >= 0.6) return 2;
  if (s.meetings >= 1) return 1;
  return 0;
}

let gid = 0;
function emblem(t, locked){
  const id = "eg" + (++gid);
  const tier = TIERS[t] || TIERS[0];
  const gold = !locked && t >= 3;
  const c1 = locked ? "#23507F" : gold ? "#FFE58A" : "#A9CBF0";
  const c2 = locked ? "#0B2748" : gold ? "#C29400" : "#1E5FA6";
  const stroke = gold ? "#F6CA13" : "#5F8FC6";
  const fillC = gold ? "#F6CA13" : "#CFE0F4";
  let inner = "";
  if (locked){
    inner = `<path d="M50 58 v-9 a10 10 0 0 1 20 0 v9" fill="none" stroke="#5F8FC6" stroke-width="5"/><rect x="44" y="57" width="32" height="26" rx="4" fill="#5F8FC6"/><circle cx="60" cy="69" r="4" fill="#032850"/>`;
  } else {
    const shift = tier.star ? 7 : 0;
    const base = 56 + (tier.chev - 1) * 7 + shift;
    for (let k = 0; k < tier.chev; k++){
      const y = base - k * 14;
      inner += `<path d="M38 ${y} L60 ${y + 12} L82 ${y} L82 ${y + 9} L60 ${y + 21} L38 ${y + 9}Z" fill="${fillC}"/>`;
    }
    if (tier.chev === 0) inner += `<circle cx="60" cy="60" r="8" fill="${fillC}"/>`;
    if (tier.star){
      let d = "";
      for (let i = 0; i < 10; i++){
        const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 4.5 : 10;
        d += (i ? "L" : "M") + (60 + Math.cos(a) * r).toFixed(1) + " " + (33 + Math.sin(a) * r).toFixed(1);
      }
      inner += `<path d="${d}Z" fill="#FFFFFF"/>`;
    }
  }
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <polygon points="60,3 111,31 111,89 60,117 9,89 9,31" fill="url(#${id})"/>
    <polygon points="60,15 100,37 100,83 60,105 20,83 20,37" fill="#032850" stroke="${stroke}" stroke-width="2"/>${inner}</svg>`;
}

function countUp(node, to, fmt, dur){
  if (reduce){ node.textContent = fmt(to); return; }
  const t0 = performance.now(), d = dur || 1200;
  (function tick(now){
    const p = Math.min(1, (now - t0) / d);
    node.textContent = fmt(to * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
}

const canvas = $("fx"), ctx = canvas.getContext("2d");
let parts = [], fxOn = false;
function sizeCanvas(){
  const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  canvas.width = r.width * dpr; canvas.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function burstAt(x, y){
  if (reduce) return;
  for (let i = 0; i < 46; i++){
    const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.4, sp = 2 + Math.random() * 6;
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, s: 2 + Math.random() * 4, c: Math.random() < .75 ? "#F6CA13" : "#FFFFFF", r: Math.random() * 6 });
  }
  if (!fxOn){ fxOn = true; requestAnimationFrame(fxLoop); }
}
function fxLoop(){
  const r = canvas.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  parts = parts.filter(p => p.life > 0);
  parts.forEach(p => {
    p.vy += .16; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.life -= .018; p.r += .2;
    ctx.save(); ctx.globalAlpha = Math.max(0, p.life); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.fillStyle = p.c; ctx.shadowColor = "#F6CA13"; ctx.shadowBlur = 10;
    ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 1.8); ctx.restore();
  });
  if (parts.length) requestAnimationFrame(fxLoop); else fxOn = false;
}

let current = null, fillTimer = null;
function renderCard(id){
  const body = $("cardBody"), card = $("card");
  clearTimeout(fillTimer);
  card.classList.remove("enter"); void card.offsetWidth; card.classList.add("enter");
  if (id === "locked"){
    body.innerHTML = `
      <div class="ctop in"><span>${lockedN} players</span><span class="rk">Locked</span></div>
      <div class="cmain in"><div class="emb steel"><div class="halo"></div>${emblem(0, true)}</div>
        <div><div class="acct">Waiting on approval</div><h1 class="pname">Basecamp</h1>
        <div class="xp"><div class="xpl"><span>Players approved</span><b>${sdrs.length} / ${DATA.totalPlayersLogged}</b></div><div class="xpbar"><i id="xpFill"></i></div></div></div></div>
      <div class="stats in">
        <div class="stat cham"><span>Locked players</span><b>${lockedN}</b></div>
        <div class="stat cham"><span>Approved</span><b>${sdrs.length}</b></div>
        <div class="stat cham money"><span>Paid out</span><b id="cardMoney">$0</b></div>
      </div>
      <p class="next in">Their September meetings are logged. Approvals move them onto the board.</p>`;
    countUp($("cardMoney"), totalBonus, money, 900);
    fillTimer = setTimeout(() => { $("xpFill").style.width = (sdrs.length / DATA.totalPlayersLogged * 100) + "%"; }, reduce ? 0 : 120);
    return;
  }
  const s = sdrs.find(x => x.id === id);
  const pos = sdrs.indexOf(s) + 1;
  const t = tierOf(s);
  const pct = Math.round(s.meetings / s.kpi * 100);
  const over = Math.max(0, s.meetings - s.kpi);
  const left = s.kpi - s.meetings;
  const next = left > 0
    ? `${left} more ${left === 1 ? "meeting" : "meetings"} to hit Summit.`
    : over > 0 ? `KPI smashed. ${over} ${over === 1 ? "meeting" : "meetings"} over target.` : "Summit reached. Every meeting from here is overdrive.";
  const brk = s.breakdown.length ? `<div class="brk in">${s.breakdown.map(([k, v]) => `<span>${k} <b>${money(v)}</b></span>`).join("")}</div>` : "";
  body.innerHTML = `
    <div class="ctop in"><span>Rank #${pos}</span><span class="rk">${TIERS[t].name}</span></div>
    <div class="cmain in"><div class="emb ${t >= 3 ? "" : "steel"}"><div class="halo"></div>${emblem(t)}</div>
      <div><div class="acct">${s.account}</div><h1 class="pname">${s.name}</h1>
      <div class="xp"><div class="xpl"><span>KPI progress</span><b>${pct}%${over ? `<span class="overtag">+${over}</span>` : ""}</b></div><div class="xpbar" id="xpBar"><i id="xpFill"></i><div class="ticks"></div></div></div></div></div>
    <div class="stats in">
      <div class="stat cham"><span>Meetings</span><b>${s.meetings}<small>/${s.kpi}</small></b></div>
      <div class="stat cham"><span>Tier</span><b>${t + 1}<small>/5</small></b></div>
      <div class="stat cham money"><span>Bonus</span><b id="cardMoney">$0</b></div>
    </div>
    ${brk}
    <p class="next in">${next}</p>`;
  countUp($("cardMoney"), s.bonus, money, 900);
  fillTimer = setTimeout(() => {
    const f = $("xpFill");
    f.style.width = Math.min(100, pct) + "%";
    if (s.meetings >= s.kpi){
      setTimeout(() => {
        const bar = $("xpBar"); if (!bar) return;
        bar.classList.add("over");
        const cr = canvas.getBoundingClientRect(), br = bar.getBoundingClientRect();
        burstAt(br.right - cr.left, br.top - cr.top + br.height / 2);
      }, reduce ? 0 : 1000);
    }
  }, reduce ? 0 : 150);
}

function renderRows(){
  $("rows").innerHTML = sdrs.map((s, i) => `
    <button class="row cham${i === 0 ? " first" : ""}" data-id="${s.id}" type="button" aria-label="${s.name}, ${s.meetings} of ${s.kpi} meetings, ${money(s.bonus)}">
      <span class="rpos">${i + 1}</span>${emblem(tierOf(s))}
      <span class="rwho"><b>${s.name}</b><span>${s.account} &nbsp;${s.meetings}/${s.kpi} meetings</span><span class="rbar"><i style="width:${Math.min(100, s.meetings / s.kpi * 100)}%"></i></span></span>
      <span class="ramt">${money(s.bonus)}</span>
    </button>`).join("");
  $("rows").querySelectorAll(".row").forEach(r => r.addEventListener("click", () => select(r.dataset.id)));
}

function renderLocked(){
  $("lockCount").textContent = `${lockedN} players`;
  $("hexes").innerHTML = Array.from({ length: lockedN }, () => `<span class="hx"></span>`).join("");
  $("locked").setAttribute("aria-label", `${lockedN} players locked, waiting on approval`);
  $("locked").addEventListener("click", () => select("locked"));
}

function renderTrack(){
  const tr = $("track");
  let h = "";
  for (let i = 1; i <= TRACK_MAX; i++){
    const left = i / TRACK_MAX * 100;
    const cls = i === KPI ? "summit" : i > KPI ? "od" : "";
    h += `<span class="node ${cls}" data-i="${i}" style="left:${left}%">${i === KPI ? "KPI" : i}</span>`;
    if (i === KPI) h += `<span class="nlab gold" style="left:${left}%">Summit</span>`;
    if (i === KPI + 2) h += `<span class="nlab gold" style="left:${left}%">Overdrive</span>`;
  }
  h += `<span class="nlab" style="left:0%">Start</span>`;
  h += sdrs.map(s => `<button class="mk" type="button" data-id="${s.id}" style="left:0%" aria-label="${s.name} on the track"><span class="tagx cham">${initials(s.name)}</span></button>`).join("");
  tr.insertAdjacentHTML("beforeend", h);
  tr.querySelectorAll(".mk").forEach(m => m.addEventListener("click", () => select(m.dataset.id)));
}
function updateTrack(id){
  const s = sdrs.find(x => x.id === id);
  const m = s ? Math.min(s.meetings, TRACK_MAX) : 0;
  $("tfill").style.width = (m / TRACK_MAX * 100) + "%";
  document.querySelectorAll(".node").forEach(n => n.classList.toggle("hit", +n.dataset.i <= m));
  document.querySelectorAll(".mk").forEach(mk => {
    const p = sdrs.find(x => x.id === mk.dataset.id);
    mk.style.left = (Math.min(p.meetings, TRACK_MAX) / TRACK_MAX * 100) + "%";
    mk.classList.toggle("sel", mk.dataset.id === id);
  });
  $("trackHint").textContent = s ? `${s.name}: ${s.meetings} of ${s.kpi}` : "Approve players to put them on the track";
}

function renderVault(){
  $("split").innerHTML = sdrs.map((s, i) => `<span class="seg${i === 0 ? " top" : ""}" style="flex:${s.bonus} 1 0;animation-delay:${.3 + i * .15}s"><em>${initials(s.name)}</em></span>`).join("");
  $("split").setAttribute("aria-label", sdrs.map(s => `${s.name} ${money(s.bonus)}`).join(", "));
  $("vleg").innerHTML = sdrs.map((s, i) => `<span class="${i === 0 ? "y" : ""}">${s.name} <b>${money(s.bonus)}</b></span>`).join("");
  const n = $("vNow");
  const small = n.querySelector("small").outerHTML;
  if (reduce){ n.innerHTML = money(totalBonus) + small; return; }
  const t0 = performance.now();
  (function tick(now){
    const p = Math.min(1, (now - t0) / 1400);
    n.innerHTML = money(totalBonus * (1 - Math.pow(1 - p, 3))) + small;
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
}

function select(id){
  if (id === current) return;
  current = id;
  document.querySelectorAll(".row").forEach(r => r.classList.toggle("sel", r.dataset.id === id));
  $("locked").classList.toggle("sel", id === "locked");
  renderCard(id);
  updateTrack(id);
}

function tickClock(){
  const ms = new Date(DATA.seasonEnd) - new Date();
  if (ms <= 0){ $("cd").textContent = "Season over"; return; }
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  const pad = v => String(v).padStart(2, "0");
  $("cd").textContent = `${d}d ${pad(h)}h ${pad(m)}m ${pad(sec)}s`;
}

function tilt(){
  const card = $("card");
  card.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse" || reduce) return;
    const r = card.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    card.style.setProperty("--ry", ((x - .5) * 7).toFixed(2) + "deg");
    card.style.setProperty("--rx", ((.5 - y) * 6).toFixed(2) + "deg");
    card.style.setProperty("--gx", (x * 100).toFixed(1) + "%");
    card.style.setProperty("--gy", (y * 100).toFixed(1) + "%");
  });
  card.addEventListener("pointerleave", () => {
    card.style.setProperty("--rx", "0deg"); card.style.setProperty("--ry", "0deg");
  });
}

function init(){
  $("season").textContent = `Season: ${DATA.seasonLabel}`;
  countUp($("hPool"), totalBonus, money, 1400);
  countUp($("hMeet"), totalMeet, v => Math.round(v).toString(), 1400);
  $("hPlay").textContent = `${sdrs.length}/${DATA.totalPlayersLogged}`;
  tickClock(); setInterval(tickClock, 1000);
  sizeCanvas(); window.addEventListener("resize", sizeCanvas);
  renderRows(); renderLocked(); renderTrack(); renderVault(); tilt();
  select(sdrs[0].id);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(init); else init();
</script>
</body>
</html>
