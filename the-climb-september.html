<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#00152C;--panel:rgba(3,38,78,.74);--panel-2:#032850;--line:rgba(130,178,235,.2);
  --ink:#F2F6FB;--ink-2:#8FAACB;--ink-3:#5C7DA3;--yellow:#F6CA13;--yellow-2:#EBC113;
  --blue:#034A92;--navy:#003466;--glow:rgba(246,202,19,.5);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Montserrat",Arial,Helvetica,sans-serif;
  --cut:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#00152C;--panel:rgba(3,38,78,.74);--ink:#F2F6FB;--ink-2:#8FAACB}
}
:root[data-theme="dark"]{--bg:#00152C;--panel:rgba(3,38,78,.74);--ink:#F2F6FB;--ink-2:#8FAACB}
:root[data-theme="light"]{--bg:#00152C;--panel:rgba(3,38,78,.74);--ink:#F2F6FB;--ink-2:#8FAACB}
*,*::before,*::after{box-sizing:inherit}
html{min-height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100%;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 600px at 28% 18%,rgba(3,74,146,.55),transparent 70%),radial-gradient(700px 500px at 95% 100%,rgba(246,202,19,.07),transparent 70%),var(--bg);overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}

.floor{position:fixed;left:-20%;right:-20%;bottom:-6vh;height:48vh;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(95,143,198,.28) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(95,143,198,.28) 1.5px,transparent 1.5px);
  background-size:64px 64px;transform:perspective(420px) rotateX(62deg);transform-origin:bottom;
  -webkit-mask-image:linear-gradient(to top,#000 10%,transparent 85%);mask-image:linear-gradient(to top,#000 10%,transparent 85%);
  animation:floor 6s linear infinite}
@keyframes floor{to{background-position:0 64px,0 0}}

.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:22px 20px 60px}

.cham{clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.panel{position:relative;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:18px 20px}
.panel::after{content:"";position:absolute;top:0;right:22px;width:34px;height:3px;background:var(--yellow)}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
h2{margin:0;font-family:var(--display);font-weight:800;font-style:italic;font-size:24px;letter-spacing:.04em;text-transform:uppercase}
.ph span{font-size:13px;font-weight:600;color:var(--ink-2)}

.topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:14px}
.logo img{height:40px;width:auto;flex:none;display:block}
.logo .bar{width:3px;height:44px;background:var(--yellow);transform:skewX(-14deg);flex:none}
.logo b{display:block;font-family:var(--display);font-weight:900;font-style:italic;font-size:34px;line-height:.9;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
